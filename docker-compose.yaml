services:

  api:
    build: 
      context: .
      dockerfile: deploy/Dockerfile.api
    image: vapp
    container_name: videostr
    environment:
      - API_KEY=${API_KEY}
      - PORT=:8080
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./assets:/app/assets

  redis:
    image: redis:latest
    container_name: videostr-redis
    restart: unless-stopped
    command: redis-server --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data/redis

  
volumes:
  redis-data:
    external: true