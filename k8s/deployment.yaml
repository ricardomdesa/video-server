apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
  namespace: video-str
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-api
  template:
    metadata:
      labels:
        app: go-api
    spec:
      containers:
      - name: go-api
        image: go-api-minikube:v1
        imagePullPolicy: Never
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: go-api-secret
              key: api_key
        ports:
        - containerPort: 8080

